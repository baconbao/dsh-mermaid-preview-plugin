# dsh-mermaid-image-preview - mount layer (bundle patch)
#
# The cordis mount row for this plugin, in the same format as the
# dsh-web-app / dsh-base bundle patches. Two ways to use it:
#
# 1) As a standalone bundle: add this package to the profile's dependencies
#    and to `dsh.profile.bundles` in the profile's package.json; the Loader
#    applies this file automatically.
#
# 2) Manual merge: merge the insert block below into the profile's
#    cordis.patch.yml (e.g. ~/.dsh/profiles/web/cordis.patch.yml) and make
#    sure dsh-mermaid-image-preview is resolvable by the Loader (node_modules
#    or a pnpm workspace link).
#
# The id is the host-side mount-row identity (the node half is a pure UI
# plugin, present only so the plugin appears in the Loader); the browser half
# is discovered through the package.json `dsh.client` declaration by
# dsh-client-modules and enters `window.__DSH_BOOT__` automatically - no
# extra registration needed.
- insert:
    - id: ui-dsh-mermaid-image-preview
      name: 'dsh-mermaid-image-preview'
